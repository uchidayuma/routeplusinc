# 静的コンテンツを GitHub Pages にデプロイするためのワークフロー
name: Deploy static content to Pages

on:
  # デフォルトブランチへのプッシュ時に実行
  push:
    branches: ["main"]

  # Actions タブから手動で実行可能にする
  workflow_dispatch:

# GITHUB_TOKEN のパーミッションを設定
permissions:
  contents: read
  pages: write
  id-token: write

# 1 つのデプロイのみを許可し、進行中の実行をキャンセルする
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # デプロイジョブ
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/setup-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4